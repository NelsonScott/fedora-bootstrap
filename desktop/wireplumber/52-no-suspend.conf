# Never idle-suspend ALSA nodes. Two reasons (2026-09-11):
# 1. The Blue Yeti sometimes fails to restart its USB stream when PipeWire re-opens it after
#    idle suspend, leaving a RUNNING node that delivers zero frames. Only a USB reset clears it.
# 2. The suspend/resume events make GNOME Settings rebuild its device list ~5s after any
#    stream stops, which dismisses the Sound panel's input/output dropdown while it's open.
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_(input|output).*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } } }
]
