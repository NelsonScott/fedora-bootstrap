# Friendly names for audio devices.
# GNOME Settings shows "<port> - <card description>"; Zoom/Chrome show the node description.
# Both are set here. Matches on stable names, so scripts using node names are unaffected.
monitor.alsa.rules = [
  # cards (what GNOME Settings displays after the dash)
  { matches = [ { device.name = "alsa_card.usb-Generic_Blue_Microphones_2240BAH07Q98-00" } ]
    actions = { update-props = { device.description = "Yeti", device.nick = "Yeti" } } }
  { matches = [ { device.name = "alsa_card.usb-046d_Logitech_BRIO_10C26E57-03" } ]
    actions = { update-props = { device.description = "BRIO webcam", device.nick = "BRIO" } } }
  { matches = [ { device.name = "alsa_card.usb-Generic_USB_Audio-00" } ]
    actions = { update-props = { device.description = "Audio interface", device.nick = "Interface" } } }
  # nodes (what Zoom, Chrome, pactl display)
  { matches = [ { node.name = "alsa_input.usb-Generic_Blue_Microphones_2240BAH07Q98-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Yeti", node.nick = "Yeti" } } }
  { matches = [ { node.name = "alsa_input.usb-046d_Logitech_BRIO_10C26E57-03.analog-stereo" } ]
    actions = { update-props = { node.description = "Webcam mic (BRIO)", node.nick = "Webcam mic" } } }
  { matches = [ { node.name = "alsa_input.usb-Generic_USB_Audio-00.HiFi__Mic__source" } ]
    actions = { update-props = { node.description = "Interface: mic jack", node.nick = "Interface mic" } } }
  { matches = [ { node.name = "alsa_input.usb-Generic_USB_Audio-00.HiFi__Line__source" } ]
    actions = { update-props = { node.description = "Interface: line in", node.nick = "Interface line" } } }
  { matches = [ { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "Speakers", node.nick = "Speakers" } } }
  { matches = [ { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "Headphones", node.nick = "Headphones" } } }
  { matches = [ { node.name = "alsa_output.usb-Generic_Blue_Microphones_2240BAH07Q98-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Yeti headphone jack", node.nick = "Yeti out" } } }
]
