# The Blue Yeti and the Logitech BRIO webcam have no S/PDIF jack, but the generic USB audio
# driver advertises one, so PipeWire lists a phantom "Digital Input (S/PDIF)" for each.
# Fedora's stock analog-only profile set drops those. (The USB audio interface keeps its
# S/PDIF output: that jack is real.)
monitor.alsa.rules = [
  { matches = [ { device.name = "alsa_card.usb-Generic_Blue_Microphones_2240BAH07Q98-00" } ]
    actions = { update-props = { device.profile-set = "analog-only.conf" } } }
  { matches = [ { device.name = "alsa_card.usb-046d_Logitech_BRIO_10C26E57-03" } ]
    actions = { update-props = { device.profile-set = "analog-only.conf" } } }
]
