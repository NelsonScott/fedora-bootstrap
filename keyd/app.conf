# Managed by fedora-bootstrap. Application-specific keyd overrides, applied by
# `keyd-application-mapper` ON TOP OF /etc/keyd/default.conf whenever a matching
# window is focused.
#
# Why: in a terminal, copy/paste/close/select-all are Ctrl+Shift+* shortcuts,
# and a bare Ctrl+C must stay as "interrupt". So in Ptyxis we make the Super
# (thumb) key emit the terminal's Ctrl+Shift+* shortcuts. Result = true Mac
# behavior: Super+C copies, Super+V pastes, while the real Ctrl+C interrupts.
#
# REQUIRES: your user must be in the `keyd` group, otherwise the app-mapper
# can't reach /run/keyd.socket and these overrides silently do nothing:
#     sudo usermod -aG keyd "$USER"    # then log out / back in
#
# The [section] matches the window CLASS. [*tyxis*] matches Ptyxis no matter how
# GNOME reports it (ptyxis / Ptyxis / org.gnome.Ptyxis). Verify with:
#     keyd-application-mapper -v       # focus Ptyxis, read the printed class

[*tyxis*]

meta.c = C-S-c
meta.v = C-S-v
meta.w = C-S-w
meta.a = C-S-a
# Cmd+N = new window (Ptyxis uses Ctrl+Shift+N; the global Ctrl+N is ignored)
meta.n = C-S-n

# Tab switching, macOS Terminal style (Cmd+Shift+Left/Right). The global
# [meta+shift] layer maps left/right to Shift+Home/End (extend selection to
# start/end of line), which swallowed the chord before Ptyxis ever saw it —
# that is why the Ptyxis-side binding appeared to stop working. Scoping the
# override here keeps Mac text-selection everywhere else. Ctrl+PageUp/PageDown
# are Ptyxis's own built-in tab shortcuts, so no gsettings change is needed.
meta+shift.left = C-pageup
meta+shift.right = C-pagedown

# Same, on the OTHER thumb-cluster modifier: because of the Mac swap the key
# LABELED Alt acts as Cmd and the key LABELED Win/Super acts as Alt/Option —
# so bind Shift+Alt+arrows too and tab switching works whichever "Alt" you
# reach for. (Requires the empty [alt+shift] layer stub in default.conf.)
alt+shift.left = C-pageup
alt+shift.right = C-pagedown

# Terminal-native Option-key text nav: the shell already binds Alt+arrows /
# Alt+Backspace for word ops, so pass them through instead of the global C-*.
alt.left = A-left
alt.right = A-right
alt.backspace = A-backspace
# Cmd+Backspace = kill to line start (readline/zsh C-u)
meta.backspace = C-u
# Cmd+Z: the global C-z would SUSPEND the foreground process (Ctrl+Z) — a
# repeated footgun (it kept suspending Claude). Ctrl+/ is readline/zsh undo.
meta.z = C-slash

# Browsers: the global [meta] layer maps Super(thumb)+T to Ctrl+Shift+T, which
# is "new tab" in terminals but "reopen last closed tab" in a browser (it pops
# an old page back open). Override it to a plain Ctrl+T = real new tab.
# Cmd+Y is history muscle memory (Chrome/Safari) -> Ctrl+H.
#
# Zoom (Cmd+= / - / 0) is NOT here: it lives in the global [meta] layer in
# /etc/keyd/default.conf so it works in every app, not just browsers.
[*irefox*]

meta.t = C-t
meta.y = C-h

# Cmd+Left/Right stays TEXT NAVIGATION (line start/end) here, same as macOS:
# it falls through to the global [meta] layer's left=home / right=end. An
# earlier version bound it to Back/Forward, which silently broke line-start /
# line-end in the omnibox and in every web text field.
# Back/Forward live on Cmd+[ and Cmd+] instead — exactly the macOS bindings —
# which are unambiguous because they are never text-cursor keys.
meta.leftbrace  = A-left
meta.rightbrace = A-right

# Chrome reports its window class as google-chrome (the app-mapper lowercases
# and dash-normalizes it, so this also catches XWayland's "Google-chrome").
[*hrome*]

meta.t = C-t
meta.y = C-h

# Cmd+Left/Right stays TEXT NAVIGATION (line start/end) here, same as macOS:
# it falls through to the global [meta] layer's left=home / right=end. An
# earlier version bound it to Back/Forward, which silently broke line-start /
# line-end in the omnibox and in every web text field.
# Back/Forward live on Cmd+[ and Cmd+] instead — exactly the macOS bindings —
# which are unambiguous because they are never text-cursor keys.
meta.leftbrace  = A-left
meta.rightbrace = A-right
