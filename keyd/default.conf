# Managed by fedora-bootstrap. Recreates a Mac keyboard's bottom row so the
# key next to the spacebar behaves like Cmd.
#
# Physical bottom-left on this PC keyboard:  Ctrl | Super(meta) | Alt | Space
# We swap Super<->Alt so the FUNCTION order:  Ctrl | Alt | Super | Space
# which matches a Mac:                         Ctrl | Option | Cmd | Space
# => the thumb key right next to the spacebar is now Super (your "Cmd").
#
# Then, while that Super (thumb) key is held:
#   Super + C / V / X = Copy / Paste / Cut   (like Cmd+C/V/X)
#   Super + T         = new tab in Ptyxis / most terminals (Ctrl+Shift+T)
# Tapping Super alone still opens the GNOME Activities overview.
#
# Caveat: inside a terminal, Super+C becomes Ctrl+C = interrupt (standard
# Linux). Copy/paste in the terminal is Ctrl+Shift+C / Ctrl+Shift+V.
#
# To revert: delete this file (or comment the lines) and `sudo keyd reload`.

[ids]
*
# Never manage ydotoold's virtual keyboard: dictation typing must pass through
# untouched, not get re-remapped by the layers below.
-2333:6666
# Razer Basilisk V2 POINTER node (event9, the one with REL x/y/wheel). The
# wildcard only grabs keyboards, so without this line keyd never sees mouse
# clicks and `[meta] leftmouse = C-leftmouse` (Cmd+click = open link in new
# tab) can never fire. Hash comes from `keyd monitor` / journalctl -u keyd.
# If the pointer ever misbehaves, delete this line and `sudo keyd reload`.
1532:0085:5126aa89

[global]
# How long a oneshot layer stays armed. Used by the double-tap-Ctrl dictation
# trigger below: the second tap must land within this window (macOS feel).
oneshot_timeout = 400

[main]
# Swap the Windows key and Alt so the thumb key (next to space) becomes Super.
leftmeta = leftalt
leftalt  = leftmeta

# Double-tap-Ctrl dictation (like macOS): hold = normal Ctrl (all combos and
# Ctrl+click work as before), tap = arm the [dtap] layer for 400ms. A second
# tap inside that window hits the [dtap] leftcontrol binding -> toggles the
# Whisper dictation daemon. Any other key just falls through unchanged.
leftcontrol = overload(control, oneshot(dtap))

[meta]
# Held = the new Super (thumb) key. Each maps a Mac chord to its Linux equivalent.
c = C-c
v = C-v
x = C-x
# new tab in Ptyxis and most terminals
t = C-S-t
# close current tab/window (Cmd+W on Mac)
w = C-w
# focus the address/location bar (Cmd+L on Mac). Frees Super+L from lock screen.
l = C-l
# select all (Cmd+A on Mac). Overrides GNOME's "show all apps" on Super+A.
a = C-a
# quit the current app (Cmd+Q on Mac). NOTE: because Super+Q is now "quit",
# the lock-screen shortcut is moved to Super+Escape via gsettings (a letter key
# in this layer can't also be part of a Ctrl+Super+<letter> combo).
q = M-q
# Cmd+Click on Mac: open link in new tab. Super(thumb)+left-click -> Ctrl+click.
leftmouse = C-leftmouse

z = C-z
s = C-s
# Cmd+1..9 = tab N in browsers/editors (GNOME's Super+digit app hotkeys are
# disabled in gsettings so these reach the app). Cmd+0 stays zoom-reset above.
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
# Cmd+arrows, Mac text navigation: line start/end, doc top/bottom.
# (Window tiling that lived on Super+arrows moves to Ctrl+Cmd+arrows.)
left = home
right = end
up = C-home
down = C-end
f = C-f
n = C-n
r = C-r
p = C-p
# Cmd+K: Obsidian command palette (moved off Cmd+P, which GNOME uses for monitor switching)
k = C-k

# Zoom (Cmd+= / Cmd+- / Cmd+0 on Mac). Global rather than per-app: Ctrl+=/-/0
# is the zoom chord in browsers, terminals, editors and most GTK apps alike.
# Without these, Super+= emitted a bare Super+= that every app ignores.
# Note: "Cmd and +" is physically Cmd+Shift+= -> handled in [meta+shift] below.
equal = C-equal
minus = C-minus
0 = C-0

# Cmd+\ = 1Password autofill (Mac default). On Linux the extension listens on
# Ctrl+Shift+X in Chrome and Firefox instead.
backslash = C-S-x

# Option-key text nav (physical Win key acts as Option after the swap):
# word jump / delete word, like macOS. Terminal gets native A-* overrides
# in app.conf since shells already bind Alt+arrows/backspace themselves.
[alt]
left = C-left
right = C-right
backspace = C-backspace

[meta+alt]
left = C-pageup
right = C-pagedown

[control+meta+alt]
left = C-A-M-left
right = C-A-M-right

[meta+shift]
# Cmd+Shift+Left/Right on Mac: extend selection to start/end of line.
left = S-home
right = S-end
# Cmd+"+" = Cmd+Shift+=. This layer shadows [meta] whenever Shift is also held,
# so the zoom entry has to be repeated here or the chord falls through unmapped.
equal = C-equal
# Cmd+Shift+Z = redo (GTK convention is Ctrl+Shift+Z)
z = C-S-z
# Screenshots: [meta] now maps bare digits (Cmd+N = tab N), and composite
# layers fall back to [meta] — so without these explicit pass-throughs,
# Cmd+Shift+3/4 would emit Ctrl+Shift+3/4 and never reach GNOME's
# screenshot bindings on Super+Shift+3/4.
3 = M-S-3
4 = M-S-4
# select to start/end of document
up = C-S-home
down = C-S-end
# Cmd+Shift+C = clipboard history (CopyQ). Explicit pass-through so the GNOME
# custom keybinding on Super+Shift+C fires even where [meta] c is overridden.
c = M-S-c

[dtap]
# Armed for 400ms by a single Ctrl tap (see [main] leftcontrol). A second tap
# lands here: toggle dictation. Runs as root; the script fans out to each
# logged-in user's dictation FIFO.
leftcontrol = command(/usr/local/bin/dictate-toggle)

[alt+shift]
# Empty on purpose: registers the composite layer so per-app overrides in
# app.conf (e.g. Ptyxis tab switching) can bind alt+shift.* chords. With no
# entries here, Shift+Alt+<key> passes through unchanged everywhere else.
